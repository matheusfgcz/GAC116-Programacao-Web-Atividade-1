<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jogo da Memória</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <main class="game-container">
        <header class="card-header">
            <h1 class="game-title">Memória Bits</h1>
            <p class="regras">Encontre as potências de 2 iguais, utilizando a menor quantidade de tentativas que puder!</p>
        </header>

        <section class="stats-panel">
            <div class="stat-badge">
                <span class="stat-label">Pares</span>
                <span class="stat-value" id="status">0 / 8</span>
            </div>
            <div class="stat-badge">
                <span class="stat-label">Tentativas</span>
                <span class="stat-value" id="tentativas">0</span>
            </div>
            <div class="stat-badge">
                <span class="stat-label">J1 vs J2</span>
                <span class="stat-value stat-sub" id="ranking-resumo">
                    <span id="valorJogador1">—</span> · <span id="valorJogador2">—</span>
                </span>
            </div>
        </section>

        <div id="tabuleiro" class="tabuleiro">
            <button type="button" class="celula" data-index="0"></button>
            <button type="button" class="celula" data-index="1"></button>
            <button type="button" class="celula" data-index="2"></button>
            <button type="button" class="celula" data-index="3"></button>
            <button type="button" class="celula" data-index="4"></button>
            <button type="button" class="celula" data-index="5"></button>
            <button type="button" class="celula" data-index="6"></button>
            <button type="button" class="celula" data-index="7"></button>
            <button type="button" class="celula" data-index="8"></button>
            <button type="button" class="celula" data-index="9"></button>
            <button type="button" class="celula" data-index="10"></button>
            <button type="button" class="celula" data-index="11"></button>
            <button type="button" class="celula" data-index="12"></button>
            <button type="button" class="celula" data-index="13"></button>
            <button type="button" class="celula" data-index="14"></button>
            <button type="button" class="celula" data-index="15"></button>
        </div>

        <div class="footer-actions">
            <button id="buttonReiniciar" class="btn-primary">Reiniciar Partida</button>
        </div>
    </main>

    <script src="main.js"></script>
</body>
</html>
